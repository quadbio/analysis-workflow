[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "analysis-workflow"
version = "0.1.1"
description = "Task paths, additive AnnData write-back and layout checks for agent-run analysis repos."
readme = "README.md"
license = "MIT"
authors = [ { name = "quadbio" } ]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [ "anndata>=0.12", "numpy", "pandas", "scipy", "typer", "zarr>=3" ]
urls.Source = "https://github.com/quadbio/analysis-workflow"
scripts.analysis-workflow = "analysis_workflow.cli:app"

[dependency-groups]
dev = [ "pre-commit", "pytest" ]

[tool.hatch]
build.targets.wheel.packages = [ "src/analysis_workflow" ]

[tool.ruff]
line-length = 120
src = [ "hooks", "src", "tests" ]
lint.select = [ "B", "C4", "D", "E", "F", "I", "UP" ]
lint.ignore = [
  "B008", # typer.Argument/Option in defaults is typer's own idiom
  "D100",
  "D104",
  "D105",
  "D107",
  "D203",
  "D213",
  "D401", # docstrings may open with a noun phrase
]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = [ "--import-mode=importlib" ]
